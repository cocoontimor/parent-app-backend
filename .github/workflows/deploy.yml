name: Build & Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for Workload Identity Federation (keyless auth to GCP).
permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: decent-genius-503000-h2
  REGION: asia-southeast1
  IMAGE: asia-southeast1-docker.pkg.dev/decent-genius-503000-h2/cocoon-prod/backend
  SERVICE: cocoon-backend-production
  MIGRATE_JOB: cocoon-migrate-production
  DIGEST_JOB: cocoon-daily-digest-production
  LESSONS_JOB: cocoon-release-lessons-production

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CICD_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:prod
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy (migrate job, then service + task jobs)
        run: |
          set -euo pipefail
          IMG="${IMAGE}:${GITHUB_SHA}"

          # Infra is provisioned by Terraform (infra/environments/production).
          # Until the first `tofu apply` has created the service, skip deploy —
          # the image is pushed and the bootstrap apply will pick it up.
          if ! gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" >/dev/null 2>&1; then
            echo "Service $SERVICE not found yet; image pushed. Run the bootstrap 'tofu apply' first."
            exit 0
          fi

          # 1) Migrations: point the migrate job at the new image and run to completion.
          gcloud run jobs update "$MIGRATE_JOB" --image "$IMG" --region "$REGION" --project "$PROJECT_ID"
          gcloud run jobs execute "$MIGRATE_JOB" --region "$REGION" --project "$PROJECT_ID" --wait

          # 2) Web service: roll out the new image (zero-downtime).
          gcloud run deploy "$SERVICE" --image "$IMG" --region "$REGION" --project "$PROJECT_ID"

          # 3) Scheduled task jobs: update their image so the next cron uses new code.
          gcloud run jobs update "$DIGEST_JOB"  --image "$IMG" --region "$REGION" --project "$PROJECT_ID"
          gcloud run jobs update "$LESSONS_JOB" --image "$IMG" --region "$REGION" --project "$PROJECT_ID"
