name: Build & Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for Workload Identity Federation (keyless auth to GCP).
permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: decent-genius-503000-h2
  REGION: asia-southeast1
  VM_NAME: cocoon-prod-backend
  VM_ZONE: asia-southeast1-a
  IMAGE: asia-southeast1-docker.pkg.dev/decent-genius-503000-h2/cocoon-prod/backend

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CICD_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:prod
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to VM (pull + restart)
        run: |
          # First push happens before the VM exists (the image must exist so the
          # VM can pull it on boot). Skip the deploy until the VM is present.
          if ! gcloud compute instances describe "$VM_NAME" --zone "$VM_ZONE" --project "$PROJECT_ID" >/dev/null 2>&1; then
            echo "VM $VM_NAME not found yet; image is pushed. Skipping deploy (it will pull on first boot)."
            exit 0
          fi
          gcloud compute ssh "$VM_NAME" \
            --zone "$VM_ZONE" --project "$PROJECT_ID" \
            --tunnel-through-iap --quiet \
            --command 'sudo bash -c '\''TOKEN=$(curl -s -H "Metadata-Flavor: Google" http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token | jq -r .access_token); docker login -u oauth2accesstoken -p "$TOKEN" https://asia-southeast1-docker.pkg.dev; cd /opt/cocoon && docker compose pull && docker compose up -d'\'''
